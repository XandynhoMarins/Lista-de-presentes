<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista de Presentes do Alexandre</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .gift-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .gift-item {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 220px;
      padding: 15px;
      transition: transform 0.2s;
    }
    .gift-item:hover {
      transform: scale(1.05);
    }
    .gift-item img {
      width: 100%;
      border-radius: 8px;
    }
    .gift-item a {
      display: block;
      margin-top: 10px;
      text-decoration: none;
      color: #2980b9;
      font-weight: bold;
      font-size: 16px;
    }
    .gift-item a:hover {
      color: #e74c3c;
    }
    p {
      margin-top: 40px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>🎁 Meus Presentes Desejados</h1>
  <div class="gift-list">
    <div class="gift-item">
      <a href="https://www.exemplo.com/tenis-nike" target="_blank">
        <img src="https://via.placeholder.com/220x150?text=T%C3%AAnis+Nike+Air" alt="Tênis Nike Air">
        Tênis Nike Air
      </a>
    </div>
    <div class="gift-item">
      <a href="https://www.exemplo.com/livro-senhor-dos-aneis" target="_blank">
        <img src="https://via.placeholder.com/220x150?text=Livro+Senhor+dos+An%C3%A9is" alt="Livro O Senhor dos Anéis">
        Livro: O Senhor dos Anéis
      </a>
    </div>
    <div class="gift-item">
      <a href="https://www.exemplo.com/smartwatch-samsung" target="_blank">
        <img src="https://via.placeholder.com/220x150?text=Smartwatch+Samsung" alt="Smartwatch Samsung Galaxy">
        Smartwatch Samsung Galaxy
      </a>
    </div>
    <div class="gift-item">
      <a href="https://www.exemplo.com/camisa-flamengo" target="_blank">
        <img src="https://via.placeholder.com/220x150?text=Camisa+Flamengo" alt="Camisa do Flamengo">
        Camisa do Flamengo
      </a>
    </div>
  </div>
  <p>Obrigado por me ajudar a realizar meus desejos! 💙</p>
</body>
</html>
